<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Login - Help Desk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#1b2a4a;height:100vh;display:flex;align-items:center;justify-content:center;}</style>
</head>
<body>
<div class="card p-4 shadow" style="width:360px;">
  <h4 class="text-center mb-3">Help Desk</h4>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      {% for msg in messages %}<div class="alert alert-danger py-2">{{ msg }}</div>{% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" name="senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>
  <p class="text-center mt-3 mb-0"><a href="{{ url_for('cadastro') }}">Criar conta</a></p>
</div>
</body>
</html>
