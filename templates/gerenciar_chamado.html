{% extends "base.html" %}
{% block content %}
<h4 class="mb-3">Gerenciar Chamado #{{ chamado.id }}</h4>
<div class="card p-4" style="max-width:700px;">
  <p><strong>Titulo:</strong> {{ chamado.titulo }}</p>
  <p><strong>Aberto por:</strong> {{ chamado.usuario.nome }}</p>
  <p><strong>Descricao:</strong><br>{{ chamado.descricao }}</p>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Status</label>
      <select class="form-select" name="status">
        <option value="Aberto" {% if chamado.status == "Aberto" %}selected{% endif %}>Aberto</option>
        <option value="Fechado" {% if chamado.status == "Fechado" %}selected{% endif %}>Fechado</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Prioridade</label>
      <select class="form-select" name="prioridade">
        <option value="Baixa" {% if chamado.prioridade == "Baixa" %}selected{% endif %}>Baixa</option>
        <option value="Media" {% if chamado.prioridade == "Media" %}selected{% endif %}>Media</option>
        <option value="Alta" {% if chamado.prioridade == "Alta" %}selected{% endif %}>Alta</option>
      </select>
    </div>
    <div class="mb-3">
      <label class="form-label">Resposta ao usuario</label>
      <textarea class="form-control" name="resposta" rows="4">{{ chamado.resposta or "" }}</textarea>
    </div>
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-link">Voltar</a>
  </form>
</div>
{% endblock %}
