<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro - Help Desk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#1b2a4a;height:100vh;display:flex;align-items:center;justify-content:center;}</style>
</head>
<body>
<div class="card p-4 shadow" style="width:360px;">
  <h4 class="text-center mb-3">Criar Conta</h4>
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Nome</label>
      <input type="text" class="form-control" name="nome" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" name="senha" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Chave admin (opcional)</label>
      <input type="password" class="form-control" name="chave_admin" placeholder="Deixe em branco se for usuario comum">
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>
  <p class="text-center mt-3 mb-0"><a href="{{ url_for('login') }}">Ja tenho conta</a></p>
</div>
</body>
</html>
