<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Help Desk</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<style>
body { background-color: #f4f6f9; }
.sidebar { min-height: 100vh; background-color: #1b2a4a; color: #fff; width:220px; }
.sidebar a { color: #cfd8ea; text-decoration: none; display:block; padding: 10px 20px; border-radius:6px; }
.sidebar a:hover { background-color: #24365c; color:#fff; }
.topbar { background:#fff; border-bottom:1px solid #e3e6ee; padding:14px 24px; }
.badge-critical{background:#e74c3c;}
.badge-high{background:#f1c40f;color:#333;}
.badge-medium{background:#2ecc71;}
.badge-low{background:#3498db;}
</style>
</head>
<body>
<div class="d-flex">
  <nav class="sidebar p-3">
    <h5 class="text-white mb-4"><i class="bi bi-life-preserver"></i> Help Desk</h5>
    <a href="{{ url_for('dashboard') }}"><i class="bi bi-ticket-detailed"></i> Chamados</a>
    <a href="{{ url_for('novo_chamado') }}"><i class="bi bi-plus-circle"></i> Novo Chamado</a>
    <a href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right"></i> Sair</a>
  </nav>
  <div class="flex-grow-1">
    <div class="topbar d-flex justify-content-between align-items-center">
      <span class="fw-semibold">Ola, {{ current_user.nome }}</span>
    </div>
    <div class="p-4">
      {% with messages = get_flashed_messages() %}
        {% if messages %}
          {% for msg in messages %}
          <div class="alert alert-info">{{ msg }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
